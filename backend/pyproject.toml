[project]
name = "clipstudio-ai-backend"
version = "0.1.0"
description = "Local-first AI content production control plane"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "black>=24.10,<26",
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["../tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "\\.venv"
explicit_package_bases = true
